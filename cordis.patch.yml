# Bundle layer applied when a dsh profile lists makima-tui in its bundles
# (dsh plugin --profile <p> add makima-tui). Composes over @deepseek-ai/dsh-base.
#
# Kept deliberately small: the TUI mounts as one row and creates its own agent
# at runtime; base-bundle tool/service rows stay untouched.

# Hot reload watches source trees; pointless and noisy under a packaged TUI.
- id: hmr
  disabled: true

# The base bundle supplies the LLM service; this row supplies the concrete
# DeepSeek HTTPS adapter and resolves its credential per request.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: 'DEEPSEEK_API_KEY'
    baseURL: !!js process.env.DEEPSEEK_BASE_URL
    thinking: enabled
    reasoningEffort: max

- insert:
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    - id: makima-tui
      name: makima-tui
      config:
        # An explicit environment override is supported, but otherwise the TUI
        # resolves the actual `dsh --profile <name>` argument at runtime.
        profile: !!js process.env.MAKIMA_TUI_PROFILE
